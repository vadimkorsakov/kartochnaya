name: Build HTML and PWA
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'kartochnaya v0.45/**'
      - 'src/**' # Includes src/storage/** and src/model/**
      - 'scripts/compile-html.mjs'
      - 'scripts/compile-javascript.mjs'
      - 'tests/source-extraction.test.mjs'
      - 'tests/colors.test.mjs'
      - 'tests/gradient-model.test.mjs'
      - 'tests/shape-catalog.test.mjs'
      - 'tests/geometry.test.mjs'
      - 'tests/indexeddb.test.mjs'
      - 'tests/project-integrity.test.mjs'
      - 'tests/project-integrity.spec.js'
      - 'tests/workspace-replace.spec.js'
      - 'tests/workspace-replace.test.mjs'
      - 'tests/zip-backup.spec.js'
      - 'tests/zip-backup.test.mjs'
      - 'scripts/verify-reproducible.mjs'
      - 'tests/known-failures.spec.js'
      - 'tests/fixtures/project-with-folders.json'
      - 'tests/indexeddb-contracts.spec.js'
      - 'tests/fixtures/shape-catalog-*.json'
      - 'tests/module-bundle.smoke.spec.js'
      - 'tests/helpers.js'
      - 'playwright.config.js'
      - 'scripts/test-server.mjs'
      - 'scripts/test-summary.cjs'
      - 'scripts/build.mjs'
      - 'scripts/distribution.mjs'
      - 'scripts/netlify*.mjs'
      - 'scripts/netlify-ignore.cjs'
      - 'tests/netlify-deploy.test.mjs'
      - '.github/workflows/deploy-netlify.yml'
      - 'tests/netlify.spec.js'
      - 'tests/google-drive.spec.js'
      - 'tests/google-drive.test.mjs'
      - 'tests/google-drive-backup.test.mjs'
      - 'tests/google-drive-accounts.test.mjs'
      - 'playwright.netlify.config.js'
      - 'netlify.toml'
      - 'scripts/verify-build.mjs'
      - 'docs/baseline-v045.json'
      - 'package.json'
      - 'package-lock.json'
      - '.node-version'
      - '.npmrc'
      - '.github/workflows/build.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/ms-playwright
      PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH: ${{ github.workspace }}/.cache/chrome-linux64/chrome
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: npm ci
      - run: npm run test:yandex
      - run: npm run test:drive
      - run: npm run test:source
      - run: npm run test:unit
      - run: npm run test:pwa
      - run: npm run build
      - run: npm run build:verify
      - run: node scripts/verify-reproducible.mjs
      - run: npx playwright install-deps chromium
      # PNG baselines require their recorded browser, not Playwright's newer one.
      - name: Install recorded Chromium version
        run: |
          chromium_version=$(node -p "require('./tests/baselines/environment.json').chromium")
          curl --fail --show-error --location --retry 3 "https://storage.googleapis.com/chrome-for-testing-public/${chromium_version}/linux64/chrome-linux64.zip" -o "$RUNNER_TEMP/chromium.zip"
          unzip -q "$RUNNER_TEMP/chromium.zip" -d "$GITHUB_WORKSPACE/.cache"
          "$PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH" --version
      - run: npm run test:netlify
      - run: npm run test:all
      - uses: actions/upload-artifact@v4
        with:
          name: kartochnaya-v045-distributions
          path: |
            dist/kartochnaya.html
            dist/kartochnaya-pwa.zip
            dist/netlify/
          if-no-files-found: error
          retention-days: 30
