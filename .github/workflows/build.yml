name: Build HTML and PWA
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'kartochnaya v0.45/**'
      - 'src/**'
      - 'scripts/**'
      - 'tests/**'
      - 'playwright*.js'
      - '.github/workflows/build.yml'
      - '.github/workflows/deploy-netlify.yml'
      - 'netlify.toml'
      - 'docs/baseline-v045.json'
      - 'package.json'
      - 'package-lock.json'
      - '.node-version'
      - '.npmrc'

# New commits supersede old PR checks. Main-branch runs are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Visible fast signal while the full browser suites run independently.
  quick:
    name: quick
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run test:cloud
      - run: npm run test:yandex
      - run: npm run test:drive
      - run: npm run test:source
      - run: npm run test:unit
      - run: npm run test:pwa
      - run: npm run build
      - run: npm run build:verify
      - run: node scripts/verify-reproducible.mjs
      # Prepared now; the final distribution is published only after all checks pass.
      - name: Stage verified distributions
        uses: actions/upload-artifact@v4
        with:
          name: preflight-distributions
          path: |
            dist/kartochnaya.html
            dist/kartochnaya-pwa.zip
            dist/netlify/
          if-no-files-found: error
          retention-days: 1

  netlify:
    name: netlify
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/ms-playwright
      PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH: ${{ github.workspace }}/.cache/chrome-linux64/chrome
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npx playwright install-deps chromium
      - name: Install recorded Chromium version
        run: |
          chromium_version=$(node -p "require('./tests/baselines/environment.json').chromium")
          curl --fail --show-error --location --retry 3 "https://storage.googleapis.com/chrome-for-testing-public/${chromium_version}/linux64/chrome-linux64.zip" -o "$RUNNER_TEMP/chromium.zip"
          unzip -q "$RUNNER_TEMP/chromium.zip" -d "$GITHUB_WORKSPACE/.cache"
          "$PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH" --version
      - run: npm run test:netlify
      - name: Preserve Netlify browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: netlify-failure-diagnostics
          path: |
            test-results/
            playwright-report/
          if-no-files-found: warn
          retention-days: 14

  diagnostics:
    name: firefox-and-wysiwyg-diagnostics
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/ms-playwright
      PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH: ${{ github.workspace }}/.cache/chrome-linux64/chrome
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install-deps chromium
      - name: Install recorded Chromium version
        run: |
          chromium_version=$(node -p "require('./tests/baselines/environment.json').chromium")
          curl --fail --show-error --location --retry 3 "https://storage.googleapis.com/chrome-for-testing-public/${chromium_version}/linux64/chrome-linux64.zip" -o "$RUNNER_TEMP/chromium.zip"
          unzip -q "$RUNNER_TEMP/chromium.zip" -d "$GITHUB_WORKSPACE/.cache"
          "$PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH" --version
      - name: Install Firefox for selection regressions
        run: npx playwright install --with-deps firefox
      - run: npm run test:spike
      - name: Report diagnostic execution separately from Gate 0A / Gate 0
        if: always()
        run: node scripts/spike-summary.cjs
      - name: Preserve plaintext-only feasibility measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plaintext-spike-measurements
          path: |
            test-results/spike-results.json
            test-results/spike-gates.json
          if-no-files-found: warn
          retention-days: 14
      - run: npm run test:selection:firefox
      - name: Multiline WYSIWYG in Chromium and Firefox
        run: npx playwright test --config=playwright.multiline.config.js
      - name: Range stroke WYSIWYG and PNG in Firefox
        run: npm run test:stroke -- --project=stroke-firefox
      - name: Preserve multiline WYSIWYG measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: multiline-wysiwyg-measurements
          path: |
            test-results/multiline
            test-results/multiline-results.json
          if-no-files-found: warn
          retention-days: 14
      - name: Preserve Firefox browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: firefox-failure-diagnostics
          path: |
            test-results/
            playwright-report/
          if-no-files-found: warn
          retention-days: 14

  browser:
    name: browser-shard-${{ matrix.shard }}-of-3
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/ms-playwright
      PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH: ${{ github.workspace }}/.cache/chrome-linux64/chrome
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npx playwright install-deps chromium
      - name: Install recorded Chromium version
        run: |
          chromium_version=$(node -p "require('./tests/baselines/environment.json').chromium")
          curl --fail --show-error --location --retry 3 "https://storage.googleapis.com/chrome-for-testing-public/${chromium_version}/linux64/chrome-linux64.zip" -o "$RUNNER_TEMP/chromium.zip"
          unzip -q "$RUNNER_TEMP/chromium.zip" -d "$GITHUB_WORKSPACE/.cache"
          "$PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH" --version
      - name: Full Playwright suite (shard ${{ matrix.shard }}/3)
        run: npm run test:all -- --shard=${{ matrix.shard }}/3
      - name: Preserve browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure-diagnostics-shard-${{ matrix.shard }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: warn
          retention-days: 14

  # Keep the historical required 'build' check, aggregating every mandatory job.
  build:
    name: build
    if: ${{ always() }}
    needs: [quick, netlify, diagnostics, browser]
    runs-on: ubuntu-latest
    steps:
      - name: Require every CI lane to pass
        env:
          QUICK_RESULT: ${{ needs.quick.result }}
          NETLIFY_RESULT: ${{ needs.netlify.result }}
          DIAGNOSTICS_RESULT: ${{ needs.diagnostics.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
        run: |
          for result in "$QUICK_RESULT" "$NETLIFY_RESULT" "$DIAGNOSTICS_RESULT" "$BROWSER_RESULT"; do
            if [[ "$result" != "success" ]]; then
              echo "::error::Full CI did not pass: quick=$QUICK_RESULT netlify=$NETLIFY_RESULT diagnostics=$DIAGNOSTICS_RESULT browser=$BROWSER_RESULT"
              exit 1
            fi
          done
      - name: Retrieve verified distributions
        uses: actions/download-artifact@v4
        with:
          name: preflight-distributions
          path: dist
      - name: Publish distributions only after complete success
        uses: actions/upload-artifact@v4
        with:
          name: kartochnaya-v045-distributions
          path: |
            dist/kartochnaya.html
            dist/kartochnaya-pwa.zip
            dist/netlify/
          if-no-files-found: error
          retention-days: 30
