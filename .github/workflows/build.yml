name: Build HTML and PWA
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'kartochnaya v0.45/**'
      - 'src/**' # Includes src/storage/** and src/model/**
      - 'scripts/compile-html.mjs'
      - 'scripts/compile-javascript.mjs'
      - 'tests/source-extraction.test.mjs'
      - 'tests/colors.test.mjs'
      - 'tests/gradient-model.test.mjs'
      - 'tests/shape-catalog.test.mjs'
      - 'tests/geometry.test.mjs'
      - 'tests/indexeddb.test.mjs'
      - 'tests/project-integrity.test.mjs'
      - 'tests/project-integrity.spec.js'
      - 'tests/workspace-replace.spec.js'
      - 'tests/workspace-replace.test.mjs'
      - 'tests/fixtures/workspace-replace-editor-diff.json'
      - 'tests/zip-backup.spec.js'
      - 'tests/zip-backup.test.mjs'
      - 'tests/fixtures/zip-backup-editor-diff.json'
      - 'scripts/verify-reproducible.mjs'
      - 'tests/known-failures.spec.js'
      - 'tests/fixtures/project-integrity-editor-diff.json'
      - 'tests/fixtures/project-with-folders.json'
      - 'tests/indexeddb-contracts.spec.js'
      - 'tests/fixtures/persistence-editor-diff.json'
      - 'tests/fixtures/shape-catalog-*.json'
      - 'tests/module-bundle.smoke.spec.js'
      - 'tests/helpers.js'
      - 'playwright.config.js'
      - 'scripts/test-server.mjs'
      - 'scripts/test-summary.cjs'
      - 'scripts/build.mjs'
      - 'scripts/distribution.mjs'
      - 'scripts/netlify*.mjs'
      - 'tests/netlify.spec.js'
      - 'tests/google-drive.spec.js'
      - 'tests/google-drive.test.mjs'
      - 'tests/google-drive-backup.test.mjs'
      - 'playwright.netlify.config.js'
      - 'netlify.toml'
      - 'scripts/verify-build.mjs'
      - 'docs/baseline-v045.json'
      - 'package.json'
      - 'package-lock.json'
      - '.node-version'
      - '.npmrc'
      - '.github/workflows/build.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/ms-playwright
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: npm ci
      - run: npm run test:source
      - run: npm run test:unit
      - run: npm run test:pwa
      - run: npm run test:drive
      - run: npm run build
      - run: npm run build:verify
      - run: node scripts/verify-reproducible.mjs
      - run: npx playwright install --with-deps chromium
      - run: npm run test:netlify
      - run: npm run test:all
      - uses: actions/upload-artifact@v4
        with:
          name: kartochnaya-v045-distributions
          path: |
            dist/kartochnaya.html
            dist/kartochnaya-pwa.zip
            dist/netlify/
          if-no-files-found: error
          retention-days: 30
