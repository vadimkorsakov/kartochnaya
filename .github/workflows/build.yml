name: Build HTML and PWA
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'kartochnaya v0.45/**'
      - 'src/**'
      - 'scripts/compile-html.mjs'
      - 'tests/source-extraction.test.mjs'
      - 'tests/colors.test.mjs'
      - 'scripts/build.mjs'
      - 'scripts/distribution.mjs'
      - 'scripts/verify-build.mjs'
      - 'docs/baseline-v045.json'
      - 'package.json'
      - 'package-lock.json'
      - '.node-version'
      - '.npmrc'
      - '.github/workflows/build.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: npm ci
      - run: npm run test:source
      - run: npm run test:unit
      - run: npm run build
      - run: npm run build:verify
      - uses: actions/upload-artifact@v4
        with:
          name: kartochnaya-v045-distributions
          path: |
            dist/kartochnaya.html
            dist/kartochnaya-pwa.zip
          if-no-files-found: error
          retention-days: 30
